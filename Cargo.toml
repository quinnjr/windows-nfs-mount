[workspace]
resolver = "3"
members = [
    "crates/xdr-derive",
    "crates/xdr-codec",
    "crates/onc-rpc",
    "crates/nfs4-types",
    "crates/nfs4-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/windows-nfs-mount"

[workspace.dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
proptest = "1"
